name: Fetch generated assets

on:
  push:
    branches: [claude/rsqured-it-cinematic-site-nbfu6h]
    paths: ['.github/workflows/fetch-assets.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/rsqured-it-cinematic-site-nbfu6h

      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y webp imagemagick

      - name: Download generated images
        run: |
          mkdir -p /tmp/raw assets/images
          curl -fsSL -o /tmp/raw/security.png "https://d8j0ntlcm91z4.cloudfront.net/user_3GGFPKjjoBnCVEnd5qSXl0QQQBl/hf_20260727_135512_00fab655-8093-4172-9950-e136095751d9.png"
          curl -fsSL -o /tmp/raw/cloud.png "https://d8j0ntlcm91z4.cloudfront.net/user_3GGFPKjjoBnCVEnd5qSXl0QQQBl/hf_20260727_135525_667f40bf-dbb2-4649-9ac6-b67c87fe13c6.png"

      - name: Optimize for web
        run: |
          convert /tmp/raw/security.png -resize 1600x -quality 82 assets/images/security-ops.webp
          convert /tmp/raw/cloud.png -resize 1600x -quality 82 assets/images/cloud-streams.webp
          identify assets/images/security-ops.webp assets/images/cloud-streams.webp

      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/images
          git commit -m "Add platform section visuals"
          git push origin claude/rsqured-it-cinematic-site-nbfu6h
