name: Fetch generated assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/rsqured-it-cinematic-site-nbfu6h

      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y webp imagemagick

      - name: Download generated images
        run: |
          mkdir -p /tmp/raw assets/images
          curl -fsSL -o /tmp/raw/hero.png "https://d8j0ntlcm91z4.cloudfront.net/user_3GGFPKjjoBnCVEnd5qSXl0QQQBl/hf_20260727_132140_743ea2de-17a0-41ef-99b6-afbb8baebf61.png"
          curl -fsSL -o /tmp/raw/rack.png "https://d8j0ntlcm91z4.cloudfront.net/user_3GGFPKjjoBnCVEnd5qSXl0QQQBl/hf_20260727_132322_b2adf25b-721d-49d1-96e0-58a39f48eaa6.png"
          curl -fsSL -o /tmp/raw/circuit.png "https://d8j0ntlcm91z4.cloudfront.net/user_3GGFPKjjoBnCVEnd5qSXl0QQQBl/hf_20260727_132332_ca22427b-d0a8-423a-a252-af67eb975ab7.png"

      - name: Optimize for web
        run: |
          convert /tmp/raw/hero.png -resize 1920x -quality 82 assets/images/hero-emblem.webp
          convert /tmp/raw/rack.png -resize 1600x -quality 82 assets/images/core-rack.webp
          convert /tmp/raw/circuit.png -resize 1600x -quality 82 assets/images/circuit-macro.webp
          convert /tmp/raw/hero.png -resize 1500x -gravity center -crop 1200x630+0+0 +repage -quality 85 assets/images/og.jpg
          identify assets/images/*

      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/images
          git commit -m "Add optimized generated visuals"
          git push origin claude/rsqured-it-cinematic-site-nbfu6h
